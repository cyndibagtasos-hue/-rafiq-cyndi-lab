<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enter Hidden Neighborhood</title>
    <style>
      :root { --bg:#0e0f16; --gold:#d6a24b; --orange:#d97d42; --text:#ece8dc; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100svh; display:grid; place-items:center; background:radial-gradient(circle at top,#252a4c,#0a0b13); color:var(--text); font-family:ui-sans-serif,system-ui; padding:1rem; }
      .card { width:min(430px,94vw); background:linear-gradient(165deg,#1f1a2b,#151722); border:1px solid rgba(214,162,75,.45); border-radius:16px; padding:1rem; box-shadow:0 20px 40px rgba(0,0,0,.45); }
      .k { opacity:.8; margin:0 0 .3rem; }
      h1 { margin:.1rem 0 .45rem; font-size:1.2rem; }
      p { margin:.2rem 0 .8rem; line-height:1.35; }
      a { display:inline-block; text-decoration:none; border-radius:10px; padding:.65rem .85rem; background:linear-gradient(90deg,var(--gold),var(--orange)); color:#1b140d; font-weight:800; }
      .small { font-size:.86rem; opacity:.8; margin-top:.7rem; }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="k">Hidden Neighborhood</p>
      <h1>Wife Entry</h1>
      <p>Come in, Cyndi. Your late-night world is ready.</p>
      <a href="index.html?preview=1&enter=1">Enter Our World</a>
      <p class="small">Tip: save this page to your iPhone Home Screen for one-tap entry.</p>
    </main>
  </body>
</html>
